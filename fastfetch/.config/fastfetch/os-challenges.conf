# OS challenge definitions for fastfetch (consumed by os-challenge.sh)
#
# Format: <key>  <label>  <start>  <end>
#   key:    hostname (preferred), OS family (ubuntu-wsl, cachyos), or * (default)
#   label:  single word, shown in the output
#   start:  ISO date (YYYY-MM-DD)
#   end:    ISO date (YYYY-MM-DD)
#
# First matching key wins, checked in this order: hostname, OS family, *.
# A host with no matching entry shows no challenge line at all.
cachyos       CachyOS     2026-11-08  2027-02-08
ubuntu-wsl    Ubuntu      2026-07-22  2028-07-22
