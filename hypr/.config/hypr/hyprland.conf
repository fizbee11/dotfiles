# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# Built-in Display
#monitor = desc:Samsung Display Corp. ATNA40CU05-0, 2880x1800@120, 0x0, 2, bitdepth, 10

# Acer 1080p Monitor --
# monitor = HDMI-A-1, 1920x1080@75, -1920x0, 1

# LG monitor 1440p 75hz
#monitor = desc:LG Electronics LG IPS QHD 403NTJJCD124, 2560x1440@74.96, -520x-1440, 1

# Set programs that you use
$terminal    = alacritty
$fileManager = dolphin
$menu        = rofi -show drun
$screencopy  = grim -g "$(slurp)" - | wl-copy
$screensave  = grim -g "$(slurp)" - | swappy -f -


# See https://wiki.hypr.land/Configuring/Basics/Autostart/

#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hyprpaper
exec-once = nm-applet
exec-once = waybar
exec-once = swaync -c ~/.config/swaync/config.json -s ~/.config/swaync/style.jss

exec-once = hypridle
exec-once = rog-control-center
exec-once = blueman-applet
#exec-once = /usr/lib/polkit-kde-authentication-agent-1


# See https://wiki.hypr.land/Configuring/Advanced-and-Cool/Environment-variables/
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
#env = QT_QPA_PLATFORMTHEME,kde
# env = QT_STYLE_OVERRIDE,kvantum
#env = QT_QPA_PLATFORM,wayland
#env = ELECTRON_OZONE_PLATFORM_HINT,auto

# See https://wiki.hypr.land/Configuring/Advanced-and-Cool/Permissions/

# ecosystem {
#     enforce_permissions = true
# }

# Note: Old 'permission' commands are mapped directly to v0.53 layout rules if uncommented
# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow



# Refer to https://wiki.hypr.land/Configuring/Basics/Variables/
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    
    col.active_border = rgba(5e81acff) rgba(81a1c1ff) 45deg
    col.inactive_border = rgba(4c566a88)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }

    blur {
        enabled = true
        size = 10
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
}

# Default curves and animations, see https://wiki.hypr.land/Configuring/Advanced-and-Cool/Animations/
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = fast, 0.25, 1.0, 0.5, 1.0


# Default springs
# Syntax: spring = name, mass, stiffness, dampening
spring = easy, 1, 71.2633, 15.8273644

animation = global, 1, 10, default
animation = border, 1, 5.39, easeOutQuint
#animation = windows, 1, 4.79, easy
animation = windowsIn, 1, 4.1, fast, popin 87%
animation = windowsOut, 1, 1.49, fast, popin 87%
animation = fadeIn, 1, 1.73, almostLinear
animation = fadeOut, 1, 1.46, almostLinear
animation = fade, 1, 3.03, quick
animation = layers, 1, 3.81, easeOutQuint
animation = layersIn, 1, 4, easeOutQuint, fade
animation = layersOut, 1, 1.5, linear, fade
animation = fadeLayersIn, 1, 1.79, almostLinear
animation = fadeLayersOut, 1, 1.39, almostLinear
animation = workspaces, 1, 1.94, almostLinear, fade
animation = workspacesIn, 1, 1.21, almostLinear, fade
animation = workspacesOut, 1, 1.94, almostLinear, fade
animation = zoomFactor, 1, 7, quick


# Ref https://wiki.hypr.land/Configuring/Basics/Workspace-Rules/
# workspace = w[tv1], gaps_out:0, gaps_in:0
# workspace = f[1], gaps_out:0, gaps_in:0
# windowrulev2 = bordersize 0, floating:0, workspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, workspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, workspace:f[1]
# windowrulev2 = rounding 0, floating:0, workspace:f[1]


dwindle {
    preserve_split = true
}

master {
    new_status = master
}

#scrolling {
#    fullscreen_on_one_column = true
#}


misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    font_family = JetBrainsMono Nerd Font
}

input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules = 

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}

# Gestures configuration
#gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 3
    # Note: Directional action mapping "horizontal = workspace" is the default behavior for swipe gestures in v0.53
#}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Advanced-and-Cool/Devices/ for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



# Sets "Windows" key as main modifier
$mainMod = SUPER

# Example binds, see https://wiki.hypr.land/Configuring/Basics/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle only

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Copilot to rofi
bind = $mainMod SHIFT, F23, exec, $menu

# Screenshot, copy or open editor
bind = $mainMod, P, exec, $screencopy
bind = $mainMod SHIFT, P, exec, $screensave

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Flags used: l (locked), r (repeating)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl2 -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl2 -e4 -n2 set 5%-

# Requires playerctl
# Flags used: l (locked)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



# See https://wiki.hypr.land/Configuring/Basics/Window-Rules/

# Ignore maximize requests from all apps. You'll probably like this.
#windowrulev2 = suppressevent maximize, class:(.*)

# Fix some dragging issues with XWayland
#windowrulev2 = nofocus, class:(^$), title:(^$), xwayland:1, floating:1, fullscreen:0, pinned:0

