# vim:ft=kitty

## name:     Nord Kitty
## license:  MIT
## nord colors: https://www.nordtheme.com/docs

# The basic colors
foreground              #eceff4
background              #2e3440
selection_foreground    #2e3440
selection_background    #eceff4

# Cursor colors
cursor                  #eceff4
cursor_text_color       #2e3440

# URL underline color when hovering with mouse
url_color               #88c0d0

# Kitty window border colors
active_border_color     #5e81ac
inactive_border_color   #4c566a
bell_border_color       #ebcb8b

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #2e3440
active_tab_background   #81a1c1
inactive_tab_foreground #eceff4
inactive_tab_background #3b4252
tab_bar_background      #2e3440

# Colors for marks (marked text in the terminal)
mark1_foreground #2e3440
mark1_background #5e81ac
mark2_foreground #2e3440
mark2_background #81a1c1
mark3_foreground #2e3440
mark3_background #88c0d0

